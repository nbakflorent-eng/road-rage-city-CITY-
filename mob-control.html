<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mob Control</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
canvas{display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const C = document.getElementById('c');
const X = C.getContext('2d');
let W = 0, H = 0;
function resize(){W=Math.min(window.innerWidth,430);H=window.innerHeight;C.width=W;C.height=H;}
resize();
window.addEventListener('resize',resize);

// ── Pool ────────────────────────────────────────────────────────────────────
// stride: x y vx vy alive team frame ftimer
const SZ=8, POOL=1800;
const M=new Float32Array(POOL*SZ);
const IDS=new Uint32Array(POOL); // unique birth IDs for gate dedup
let idCtr=0, nG=0, nR=0;
const FL=[];

function resetPool(){M.fill(0);FL.length=0;for(let i=POOL-1;i>=0;i--)FL.push(i);nG=nR=0;}

function alloc(x,y,vx,vy,team){
  if(!FL.length)return -1;
  const i=FL.pop(), b=i*SZ;
  M[b]=x;M[b+1]=y;M[b+2]=vx;M[b+3]=vy;M[b+4]=1;M[b+5]=team;M[b+6]=0;M[b+7]=0;
  IDS[i]=++idCtr;
  if(team===0)nG++;else nR++;
  return i;
}

function kill(i){
  const b=i*SZ;
  if(!M[b+4])return;
  if(M[b+5]===0)nG--;else nR--;
  M[b+4]=0;FL.push(i);
}

// ── Spatial hash ─────────────────────────────────────────────────────────────
const CSIZ=26, GRID=new Map();
function buildGrid(){
  GRID.clear();
  for(let i=0;i<POOL;i++){const b=i*SZ;if(!M[b+4])continue;
    const k=((M[b]/CSIZ)|0)*100000+((M[b+1]/CSIZ)|0);
    let c=GRID.get(k);if(!c){c=[];GRID.set(k,c);}c.push(i);}
}
function near(x,y){
  const out=[],cx=(x/CSIZ)|0,cy=(y/CSIZ)|0;
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
    const c=GRID.get((cx+dx)*100000+(cy+dy));if(c)for(const v of c)out.push(v);}
  return out;
}

// ── Particles ─────────────────────────────────────────────────────────────────
const PS=[];
function burst(x,y,col,n=8){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*3.5;PS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,col,sz:2+Math.random()*3});}}
function tickPS(){for(let i=PS.length-1;i>=0;i--){const p=PS[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.14;p.l-=0.042;if(p.l<=0)PS.splice(i,1);}}
function drawPS(){X.save();for(const p of PS){X.globalAlpha=p.l;X.fillStyle=p.col;X.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}X.globalAlpha=1;X.restore();}

// ── Floaters ──────────────────────────────────────────────────────────────────
const FL2=[];
function floater(x,y,t,col){FL2.push({x,y,vy:-1.8,t,col,l:1.4});}
function tickFL2(){for(let i=FL2.length-1;i>=0;i--){const f=FL2[i];f.y+=f.vy;f.l-=0.024;if(f.l<=0)FL2.splice(i,1);}}
function drawFL2(){X.save();X.textAlign='center';for(const f of FL2){X.globalAlpha=Math.min(1,f.l);X.font='bold 20px Arial';X.strokeStyle='#000';X.lineWidth=3;X.strokeText(f.t,f.x,f.y);X.fillStyle=f.col;X.fillText(f.t,f.x,f.y);}X.globalAlpha=1;X.restore();}

// ── Shake ─────────────────────────────────────────────────────────────────────
let shN=0,shM=0;
function shake(m){shN=14;shM=m;}

// ── Lane helpers ──────────────────────────────────────────────────────────────
const MR=7;
const laneTopY=()=>H*0.10, laneBotY=()=>H*0.78, cannonY=()=>H*0.87;

function laneEdge(t){
  const tw=W*0.09, bw=W*0.47, h=tw+(bw-tw)*t;
  return{l:W/2-h, r:W/2+h};
}
function laneT(y){return(y-laneTopY())/(laneBotY()-laneTopY());}

// ── Game state ────────────────────────────────────────────────────────────────
let level=1, hand=0, pend=0; // hand=unfired, pend=gate spawns in flight
let tanks=[], gates=[], queued=[];
let fireT=0, FIRE_INT=8, enemyT=0, ENEMY_INT=140;
let holding=false, ptrX=0, aimAngle=-Math.PI/2;
let gst='play', gstCD=0; // game state

const GSPD=3.4, RSPD=2.4;

// ── Init ──────────────────────────────────────────────────────────────────────
function initLevel(){
  resetPool();PS.length=0;FL2.length=0;queued.length=0;
  ptrX=W/2; aimAngle=-Math.PI/2; holding=false; fireT=0;
  hand=12+level*4; pend=0;
  FIRE_INT=Math.max(4,11-Math.floor(level/2));
  ENEMY_INT=Math.max(40,140-level*10);
  enemyT=80;

  const nT=level>=3?2:1, hp=14+level*9;
  tanks=[];
  const ty=laneTopY()+10;
  if(nT===1){
    tanks.push({x:W/2,y:ty,hp,max:hp,fl:0,w:56,h:28});
  } else {
    const e=laneEdge(laneT(ty));
    tanks.push({x:e.l+(e.r-e.l)*0.28,y:ty,hp,max:hp,fl:0,w:50,h:26});
    tanks.push({x:e.l+(e.r-e.l)*0.72,y:ty,hp,max:hp,fl:0,w:50,h:26});
  }
  buildGates();
  gst='play'; gstCD=0;
}

function buildGates(){
  gates=[];
  const rows=Math.min(5+Math.floor(level*0.7),9);
  const ltY=laneTopY(), lbY=laneBotY();
  const step=(lbY-ltY)/(rows+1);
  for(let r=0;r<rows;r++){
    const gy=ltY+step*(r+1);
    const e=laneEdge(laneT(gy));
    gates.push(mkG(e.l+5, W/2-5, gy, r));
    gates.push(mkG(W/2+5, e.r-5, gy, r));
  }
}

function mkG(x1,x2,y,row){
  const h=28;
  // trap 8% chance
  if(Math.random()<0.08)
    return{x1,x2,y,h,type:'add',val:-5,label:'-5',color:'#e74c3c',fl:0,vis:new Set()};
  const tiers=[
    [{type:'add',val:5,label:'+5',color:'#27ae60'},{type:'add',val:10,label:'+10',color:'#2ecc71'},{type:'mul',val:2,label:'×2',color:'#2980b9'}],
    [{type:'add',val:10,label:'+10',color:'#2ecc71'},{type:'mul',val:2,label:'×2',color:'#2980b9'},{type:'mul',val:3,label:'×3',color:'#8e44ad'}],
    [{type:'mul',val:3,label:'×3',color:'#8e44ad'},{type:'mul',val:5,label:'×5',color:'#e67e22'},{type:'add',val:20,label:'+20',color:'#27ae60'}],
  ];
  const tier=Math.min(2,Math.floor(level/2)+(row>=3?1:0));
  const pool=tiers[Math.min(2,tier)];
  return{x1,x2,y,h,...pool[(Math.random()*pool.length)|0],fl:0,vis:new Set()};
}

// ── Gate apply ────────────────────────────────────────────────────────────────
function applyGate(g,mobIdx,mx,my){
  const uid=IDS[mobIdx];
  if(g.vis.has(uid))return;
  g.vis.add(uid); g.fl=20;

  if(g.type==='add'){
    if(g.val<0){
      // penalty: kill |val| green mobs
      let k=Math.min(-g.val, nG+hand);
      // kill from screen first
      for(let i=0;i<POOL&&k>0;i++){const b=i*SZ;if(M[b+4]&&M[b+5]===0){kill(i);k--;}}
      hand=Math.max(0, hand-k); // kill rest from hand
    } else {
      hand+=g.val; pend+=g.val;
      for(let k=0;k<g.val;k++)
        queued.push({d:k*3, x:mx+(Math.random()-.5)*24, y:my+(Math.random()-.5)*6,
          vx:(Math.random()-.5)*1.6, vy:-(GSPD*(.8+Math.random()*.5)), t:0});
    }
  } else {
    if(g.val<1){
      const kn=Math.floor(nG*(1-g.val));
      let k=kn;
      for(let i=0;i<POOL&&k>0;i++){const b=i*SZ;if(M[b+4]&&M[b+5]===0){kill(i);k--;}}
    } else {
      const extras=Math.min(Math.floor(nG*(g.val-1)),280);
      hand+=extras; pend+=extras;
      for(let k=0;k<extras;k++)
        queued.push({d:(k%60)*2, x:mx+(Math.random()-.5)*32, y:my+(Math.random()-.5)*10,
          vx:(Math.random()-.5)*2, vy:-(GSPD*(.7+Math.random()*.6)), t:0});
    }
  }
}

// ── Enemy fire ────────────────────────────────────────────────────────────────
function enemyFire(){
  const n=2+Math.min(level,7);
  for(const t of tanks){
    if(t.hp<=0)continue;
    for(let k=0;k<n;k++)
      alloc(t.x+(Math.random()-.5)*t.w*.85, t.y+t.h/2+5,
            (Math.random()-.5)*1.3, RSPD*(.9+Math.random()*.3), 1);
  }
}

// ── Update ────────────────────────────────────────────────────────────────────
function update(){
  if(gst!=='play'){if(--gstCD<=0){if(gst==='win'){level++;initLevel();}else{level=1;initLevel();}}return;}

  // Aim angle from pointer
  const norm=Math.max(-1,Math.min(1,(ptrX-W/2)/(W*0.38)));
  const target=-Math.PI/2+norm*Math.PI*0.38;
  aimAngle+=(target-aimAngle)*0.22;

  // Fire
  if(holding&&hand>0){
    if(--fireT<=0){
      hand--;
      const bx=W/2+Math.cos(aimAngle)*30, by=cannonY()+Math.sin(aimAngle)*30;
      alloc(bx,by,Math.cos(aimAngle)*GSPD*1.35,Math.sin(aimAngle)*GSPD*1.35,0);
      fireT=FIRE_INT;
    }
  }

  // Queued gate spawns
  for(let i=queued.length-1;i>=0;i--){
    const q=queued[i];
    if(--q.d<=0){alloc(q.x,q.y,q.vx,q.vy,q.t);pend=Math.max(0,pend-1);queued.splice(i,1);}
  }

  // Move + animate
  for(let i=0;i<POOL;i++){
    const b=i*SZ;if(!M[b+4])continue;
    M[b]+=M[b+2];M[b+1]+=M[b+3];
    if(++M[b+7]>=7){M[b+7]=0;M[b+6]=(M[b+6]+1)%4;}
    const spd=Math.hypot(M[b+2],M[b+3]);
    const cap=M[b+5]===0?GSPD*2.4:RSPD*2.4;
    if(spd>cap){M[b+2]*=cap/spd;M[b+3]*=cap/spd;}
    if(M[b]<-30||M[b]>W+30||M[b+1]<-90||M[b+1]>H+40)kill(i);
  }

  buildGrid();

  // Separation (same team only)
  for(let i=0;i<POOL;i++){
    const b=i*SZ;if(!M[b+4])continue;
    let sx=0,sy=0;
    for(const j of near(M[b],M[b+1])){
      if(j===i)continue;const bj=j*SZ;
      if(!M[bj+4]||M[bj+5]!==M[b+5])continue;
      const dx=M[b]-M[bj],dy=M[b+1]-M[bj+1],d2=dx*dx+dy*dy;
      if(d2<(MR*2.6)*(MR*2.6)&&d2>0.01){const d=Math.sqrt(d2);sx+=dx/d;sy+=dy/d;}
    }
    M[b+2]+=sx*.05;M[b+3]+=sy*.05;
  }

  // Gate check (green, moving upward)
  for(let i=0;i<POOL;i++){
    const b=i*SZ;if(!M[b+4]||M[b+5]!==0||M[b+3]>=0)continue;
    const mx=M[b],my=M[b+1];
    for(const g of gates){
      if(my>g.y+g.h/2+2||my<g.y-g.h/2-2)continue;
      if(mx<g.x1||mx>g.x2)continue;
      applyGate(g,i,mx,my);break;
    }
  }

  // Combat: green vs red (both die)
  buildGrid();
  const dead=new Set();
  for(let i=0;i<POOL;i++){
    const b=i*SZ;if(!M[b+4]||dead.has(i))continue;
    const ti=M[b+5];
    for(const j of near(M[b],M[b+1])){
      if(j===i||dead.has(j))continue;
      const bj=j*SZ;if(!M[bj+4]||M[bj+5]===ti)continue;
      const dx=M[b]-M[bj],dy=M[b+1]-M[bj+1];
      if(dx*dx+dy*dy<(MR*2.1)*(MR*2.1)){
        burst((M[b]+M[bj])/2,(M[b+1]+M[bj+1])/2,ti===0?'#2ecc71':'#e74c3c',6);
        dead.add(i);dead.add(j);break;
      }
    }
  }
  for(const idx of dead)kill(idx);

  // Green hits tank
  for(let i=0;i<POOL;i++){
    const b=i*SZ;if(!M[b+4]||M[b+5]!==0)continue;
    for(const t of tanks){
      if(t.hp<=0)continue;
      if(M[b]>t.x-t.w/2&&M[b]<t.x+t.w/2&&M[b+1]>t.y-t.h-6&&M[b+1]<t.y+t.h/2+8){
        t.hp--;t.fl=12;kill(i);
        shake(t.hp>0?4:12);
        floater(t.x+(Math.random()-.5)*18,t.y-t.h-12,'-1','#ff6b6b');
        if(t.hp<=0)burst(t.x,t.y,'#ff4040',14);
        break;
      }
    }
  }

  // Ticks
  for(const t of tanks)if(t.fl>0)t.fl--;
  for(const g of gates)if(g.fl>0)g.fl--;
  if(--enemyT<=0){enemyFire();enemyT=ENEMY_INT;}
  tickPS();tickFL2();
  if(shN>0)shN--;

  if(tanks.every(t=>t.hp<=0)){gst='win';gstCD=140;}

  // Lose: any red mob crosses cannon line
  const cy=cannonY();
  for(let i=0;i<POOL;i++){
    const b=i*SZ;if(!M[b+4]||M[b+5]!==1)continue;
    if(M[b+1]>cy+18){gst='lose';gstCD=140;return;}
  }
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function drawRoad(){
  const lt=laneTopY(),lb=laneBotY();
  const tl=laneEdge(0),bl=laneEdge(1);
  X.beginPath();X.moveTo(tl.l,lt);X.lineTo(tl.r,lt);X.lineTo(bl.r,lb);X.lineTo(bl.l,lb);X.closePath();
  const g=X.createLinearGradient(W/2,lt,W/2,lb);
  g.addColorStop(0,'#2c3e50');g.addColorStop(1,'#3d5166');
  X.fillStyle=g;X.fill();
  // dashes
  X.save();X.setLineDash([10,16]);X.strokeStyle='rgba(255,255,255,0.1)';X.lineWidth=2;
  X.beginPath();X.moveTo(W/2,lt);X.lineTo(W/2,lb);X.stroke();
  X.setLineDash([]);X.restore();
  // edges
  X.strokeStyle='#e67e22';X.lineWidth=3;
  X.beginPath();X.moveTo(tl.l,lt);X.lineTo(bl.l,lb);X.stroke();
  X.beginPath();X.moveTo(tl.r,lt);X.lineTo(bl.r,lb);X.stroke();
}

function drawGates(){
  X.textBaseline='middle';
  for(const g of gates){
    X.save();
    if(g.fl>0){X.shadowColor='#fff';X.shadowBlur=18;}
    const w=g.x2-g.x1;
    X.beginPath();X.roundRect(g.x1,g.y-g.h/2,w,g.h,7);
    const gr=X.createLinearGradient(g.x1,0,g.x2,0);
    gr.addColorStop(0,g.color+'99');gr.addColorStop(0.5,g.color);gr.addColorStop(1,g.color+'99');
    X.fillStyle=gr;X.fill();
    X.fillStyle='#fff';X.font='bold 14px Arial';X.textAlign='center';
    X.fillText(g.label,g.x1+w/2,g.y);
    X.restore();
  }
  X.textBaseline='alphabetic';
}

function drawMob(x,y,frame,team){
  const r=MR, bc=team===0?'#2ecc71':'#e74c3c', hc=team===0?'#f0c070':'#f5c0a0';
  const lo=[0,3.5,0,-3.5][frame%4];
  X.fillStyle=bc;
  X.beginPath();X.ellipse(x-2.5,y+r+2+lo,2,4.5,0.15,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(x+2.5,y+r+2-lo,2,4.5,-0.15,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fill();
  X.fillStyle=hc;X.beginPath();X.arc(x,y-r*.88,r*.55,0,Math.PI*2);X.fill();
  X.fillStyle='#333';
  X.beginPath();X.arc(x-1.7,y-r*.93,1.1,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(x+1.7,y-r*.93,1.1,0,Math.PI*2);X.fill();
}

function drawMobs(){
  for(let i=0;i<POOL;i++){const b=i*SZ;if(!M[b+4])continue;drawMob(M[b],M[b+1],M[b+6],M[b+5]);}
}

function drawTanks(){
  for(const t of tanks){
    if(t.hp<=0)continue;
    X.save();if(t.fl>0)X.filter='brightness(2.5)';
    // treads
    X.fillStyle='#555';X.beginPath();X.roundRect(t.x-t.w/2-4,t.y-7,t.w+8,13,4);X.fill();
    // hull
    X.fillStyle=t.fl>0?'#ff3030':'#c0392b';X.fillRect(t.x-t.w/2,t.y-t.h,t.w,t.h);
    // turret
    X.fillStyle=t.fl>0?'#ff5050':'#e74c3c';
    X.beginPath();X.ellipse(t.x,t.y-t.h-3,t.w*.30,9,0,0,Math.PI*2);X.fill();
    // barrel pointing down
    X.fillStyle='#888';X.beginPath();X.roundRect(t.x-4,t.y-t.h-1,8,t.h*.58,2);X.fill();
    X.fillStyle='#fff';X.font='bold 10px Arial';X.textAlign='center';X.fillText('★',t.x,t.y-t.h/2+5);
    X.restore();
    // HP bar
    const bw=t.w+18,bh=8,bx=t.x-bw/2,by=t.y-t.h-22;
    X.fillStyle='#333';X.fillRect(bx,by,bw,bh);
    const pct=t.hp/t.max;
    X.fillStyle=pct>.6?'#2ecc71':pct>.3?'#f39c12':'#e74c3c';X.fillRect(bx,by,bw*pct,bh);
    X.strokeStyle='#aaa';X.lineWidth=1;X.strokeRect(bx,by,bw,bh);
    X.fillStyle='#fff';X.font='bold 9px Arial';X.textAlign='center';X.fillText(`${t.hp}/${t.max}`,t.x,by-1);
  }
}

function drawCannon(){
  const cy=cannonY();
  X.save();X.translate(W/2,cy);
  [-18,18].forEach(ox=>{
    X.fillStyle='#444';X.beginPath();X.arc(ox,14,10,0,Math.PI*2);X.fill();
    X.fillStyle='#777';X.beginPath();X.arc(ox,14,5,0,Math.PI*2);X.fill();
  });
  X.fillStyle='#2980b9';X.beginPath();X.roundRect(-26,0,52,18,4);X.fill();
  X.save();
  X.rotate(aimAngle+Math.PI/2);
  X.fillStyle='#1a6fa8';X.beginPath();X.roundRect(-6,-36,12,38,4);X.fill();
  X.fillStyle='#1565c0';X.beginPath();X.roundRect(-7,-38,14,9,3);X.fill();
  X.restore();
  X.fillStyle='#3498db';X.beginPath();X.arc(0,0,14,0,Math.PI*2);X.fill();
  X.restore();
}

function drawHUD(){
  const total=hand+nG+pend;
  X.font='bold 52px Arial';X.textAlign='center';
  X.strokeStyle='#000';X.lineWidth=5;X.strokeText(total,W/2,cannonY()-36);
  X.fillStyle='#fff';X.fillText(total,W/2,cannonY()-36);
  X.font='bold 17px Arial';X.textAlign='left';
  X.strokeStyle='#000';X.lineWidth=3;X.strokeText('Level '+level,12,26);
  X.fillStyle='#fff';X.fillText('Level '+level,12,26);
  if(holding){
    X.save();X.setLineDash([5,9]);X.strokeStyle='rgba(255,255,255,.32)';X.lineWidth=1.5;
    const bx=W/2+Math.cos(aimAngle)*18,by=cannonY()+Math.sin(aimAngle)*18;
    X.beginPath();X.moveTo(bx,by);X.lineTo(bx+Math.cos(aimAngle)*190,by+Math.sin(aimAngle)*190);
    X.stroke();X.setLineDash([]);X.restore();
  }
}

function drawOverlay(){
  if(gst==='win'){
    X.fillStyle='rgba(0,0,0,.5)';X.fillRect(0,0,W,H);
    X.font='bold 56px Arial';X.textAlign='center';
    X.strokeStyle='#000';X.lineWidth=6;X.strokeText('VICTORY!',W/2,H/2-10);
    X.fillStyle='#f1c40f';X.fillText('VICTORY!',W/2,H/2-10);
    X.font='bold 22px Arial';X.fillStyle='#fff';X.fillText('Level '+level+' clear!',W/2,H/2+28);
  } else if(gst==='lose'){
    X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,0,W,H);
    X.font='bold 56px Arial';X.textAlign='center';
    X.strokeStyle='#000';X.lineWidth=6;X.strokeText('DEFEAT!',W/2,H/2-10);
    X.fillStyle='#e74c3c';X.fillText('DEFEAT!',W/2,H/2-10);
    X.font='bold 20px Arial';X.fillStyle='#fff';X.fillText('Restarting...',W/2,H/2+28);
  }
}

function draw(){
  X.save();
  if(shN>0){const s=shM*(shN/14);X.translate((Math.random()-.5)*s,(Math.random()-.5)*s);}
  X.fillStyle='#0f2027';X.fillRect(0,0,W,H);
  drawRoad();drawGates();drawMobs();drawTanks();drawCannon();drawPS();drawFL2();drawHUD();drawOverlay();
  X.restore();
}

// ── Input ─────────────────────────────────────────────────────────────────────
function gx(e){return(e.touches?e.touches[0].clientX:e.clientX)-C.getBoundingClientRect().left;}
C.addEventListener('mousedown', e=>{holding=true;ptrX=gx(e);fireT=0;});
C.addEventListener('mousemove', e=>{ptrX=gx(e);});
C.addEventListener('mouseup',   ()=>{holding=false;});
C.addEventListener('mouseleave',()=>{holding=false;});
C.addEventListener('touchstart',e=>{e.preventDefault();holding=true;ptrX=gx(e);fireT=0;},{passive:false});
C.addEventListener('touchmove', e=>{e.preventDefault();ptrX=gx(e);},{passive:false});
C.addEventListener('touchend',  e=>{e.preventDefault();holding=false;},{passive:false});

// ── Loop ──────────────────────────────────────────────────────────────────────
initLevel();
(function loop(){requestAnimationFrame(loop);update();draw();})();
</script>
</body>
</html>
