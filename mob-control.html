<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mob Control</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; display:flex; justify-content:center; align-items:center;
       height:100vh; overflow:hidden; }
canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ─── Canvas ─────────────────────────────────────────────────────────────────
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W = 0, H = 0;
function resize() {
  W = Math.min(window.innerWidth, 430);
  H = window.innerHeight;
  cv.width = W; cv.height = H;
}
resize();
window.addEventListener('resize', resize);

// ─── Layout (straight top-down rectangle, NO perspective) ───────────────────
const LL  = () => W * 0.10;  // lane left edge
const LR  = () => W * 0.90;  // lane right edge
const LW  = () => LR() - LL(); // lane width
const TY  = () => H * 0.06;  // top of lane
const BY  = () => H * 0.80;  // bottom of lane
const CY  = () => H * 0.88;  // cannon center y

// ─── Mob pool (typed arrays, zero GC) ───────────────────────────────────────
const POOL = 1400, ST = 8; // stride: x y vx vy alive team frame ftimer
const M = new Float32Array(POOL * ST);
const MID = new Uint32Array(POOL); // unique spawn IDs
let uid = 0, nG = 0, nR = 0;
const FREE = [];

function poolInit() {
  M.fill(0); FREE.length = 0;
  for (let i = POOL-1; i >= 0; i--) FREE.push(i);
  nG = nR = 0;
}

function spawn(x, y, vx, vy, team) {
  if (!FREE.length) return -1;
  const i = FREE.pop(), b = i*ST;
  M[b]=x; M[b+1]=y; M[b+2]=vx; M[b+3]=vy;
  M[b+4]=1; M[b+5]=team; M[b+6]=0; M[b+7]=0;
  MID[i] = ++uid;
  if (team===0) nG++; else nR++;
  return i;
}

function die(i) {
  const b = i*ST;
  if (!M[b+4]) return;
  if (M[b+5]===0) nG--; else nR--;
  M[b+4]=0; FREE.push(i);
}

// ─── Spatial hash ────────────────────────────────────────────────────────────
const CS = 24, HASH = new Map();
function buildHash() {
  HASH.clear();
  for (let i = 0; i < POOL; i++) {
    const b = i*ST; if (!M[b+4]) continue;
    const k = ((M[b]/CS)|0)*100000 + ((M[b+1]/CS)|0);
    let c = HASH.get(k); if (!c) { c=[]; HASH.set(k,c); } c.push(i);
  }
}
function query(x, y) {
  const out=[], cx2=(x/CS)|0, cy2=(y/CS)|0;
  for (let dx=-1; dx<=1; dx++)
    for (let dy=-1; dy<=1; dy++) {
      const c = HASH.get((cx2+dx)*100000+cy2+dy);
      if (c) for (const v of c) out.push(v);
    }
  return out;
}

// ─── Particles ───────────────────────────────────────────────────────────────
const PARTS = [];
function burst(x, y, col, n=8) {
  for (let i=0; i<n; i++) {
    const a=Math.random()*Math.PI*2, s=2+Math.random()*3.5;
    PARTS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,col,sz:2+Math.random()*3});
  }
}
function tickParts() {
  for (let i=PARTS.length-1; i>=0; i--) {
    const p=PARTS[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.l-=0.04;
    if (p.l<=0) PARTS.splice(i,1);
  }
}
function drawParts() {
  cx.save();
  for (const p of PARTS) { cx.globalAlpha=p.l; cx.fillStyle=p.col; cx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz); }
  cx.globalAlpha=1; cx.restore();
}

// ─── Floating numbers ────────────────────────────────────────────────────────
const NUMS = [];
function addNum(x, y, t, col) { NUMS.push({x, y, vy:-1.8, t, col, l:1.4}); }
function tickNums() { for (let i=NUMS.length-1; i>=0; i--) { const n=NUMS[i]; n.y+=n.vy; n.l-=0.024; if(n.l<=0) NUMS.splice(i,1); } }
function drawNums() {
  cx.save(); cx.textAlign='center';
  for (const n of NUMS) {
    cx.globalAlpha=Math.min(1,n.l); cx.font='bold 20px Arial';
    cx.strokeStyle='#000'; cx.lineWidth=3; cx.strokeText(n.t,n.x,n.y);
    cx.fillStyle=n.col; cx.fillText(n.t,n.x,n.y);
  }
  cx.globalAlpha=1; cx.restore();
}

// ─── Screen shake ────────────────────────────────────────────────────────────
let shT=0, shA=0;
function shake(a) { shT=14; shA=a; }

// ─── Game data ────────────────────────────────────────────────────────────────
const G_SPD = 3.2, R_SPD = 2.4, MOB_R = 7;
let level=1, hand=0, pend=0;
let tanks=[], gates=[], rocks=[], queue=[];
let fireT=0, FIRE_I=7, enmT=0, ENM_I=130;
let holding=false, ptrX=0, angle=-Math.PI/2;
let gst='play', gstT=0;

// ─── Level setup ─────────────────────────────────────────────────────────────
function initLevel() {
  poolInit(); PARTS.length=0; NUMS.length=0; queue.length=0;
  ptrX=W/2; angle=-Math.PI/2; holding=false; fireT=0;
  hand = 12 + level*4; pend = 0;
  FIRE_I = Math.max(4, 10 - Math.floor(level/2));
  ENM_I  = Math.max(45, 130 - level*9);
  enmT   = 80;

  // Tanks
  const ty = TY()+22, hp = 14 + level*9;
  tanks = [];
  if (level < 3) {
    tanks.push({x:W/2, y:ty, hp, max:hp, fl:0, w:56, h:28});
  } else {
    tanks.push({x:W/2-W*0.17, y:ty, hp, max:hp, fl:0, w:50, h:26});
    tanks.push({x:W/2+W*0.17, y:ty, hp, max:hp, fl:0, w:50, h:26});
  }

  buildLayout();
  gst='play'; gstT=0;
}

// ─── Build gate rows + rocks ──────────────────────────────────────────────────
function buildLayout() {
  gates=[]; rocks=[];
  const rows = Math.min(5+Math.floor(level*0.6), 8);
  const yTop = TY()+65, yBot = BY()-20;
  const step = (yBot-yTop)/(rows+1);
  const ll=LL(), lr=LR(), rkW=44, rkH=32, pad=5;

  for (let r=0; r<rows; r++) {
    const gy = yTop + step*(r+1);
    // Center rock
    rocks.push({x:W/2-rkW/2, y:gy-rkH/2, w:rkW, h:rkH});
    // Left gate  (lane-left to rock-left)
    gates.push(mkGate(ll+pad, W/2-rkW/2-pad, gy, r));
    // Right gate (rock-right to lane-right)
    gates.push(mkGate(W/2+rkW/2+pad, lr-pad, gy, r));
    // Extra side rock randomly between rows
    if (r < rows-1 && Math.random() < 0.5) {
      const side = Math.random()<0.5;
      const ew=28+Math.random()*18, eh=22+Math.random()*12;
      const lim = (lr-ll)/2 - rkW/2 - ew - 20;
      const ex = side ? ll+8+Math.random()*Math.max(4,lim) : W/2+rkW/2+8+Math.random()*Math.max(4,lim);
      const ey = gy+step*0.4+Math.random()*step*0.15;
      rocks.push({x:ex, y:ey-eh/2, w:ew, h:eh});
    }
  }
}

function gateColor(type, val) {
  if (type==='add' && val<0) return '#c0392b';
  if (type==='add') return '#27ae60';
  if (val===2) return '#2980b9';
  if (val===3) return '#8e44ad';
  return '#e67e22';
}

function mkGate(x1, x2, y, row) {
  if (Math.random()<0.06)
    return {x1,x2,y,h:28,type:'add',val:-5,label:'-5',color:'#c0392b',fl:0,vis:new Set(),once:false};
  const pools=[
    [{type:'add',val:5,label:'+5'},{type:'add',val:10,label:'+10'},{type:'mul',val:2,label:'×2'}],
    [{type:'add',val:10,label:'+10'},{type:'mul',val:2,label:'×2'},{type:'mul',val:3,label:'×3'}],
    [{type:'mul',val:3,label:'×3'},{type:'mul',val:5,label:'×5'},{type:'add',val:15,label:'+15'}],
  ];
  const tier = Math.min(2, Math.floor(level/2)+(row>=3?1:0));
  const g = pools[Math.min(2,tier)][(Math.random()*pools[Math.min(2,tier)].length)|0];
  return {x1,x2,y,h:28,...g,color:gateColor(g.type,g.val),fl:0,vis:new Set(),once:false};
}

// ─── Gate logic ───────────────────────────────────────────────────────────────
// CORRECT multiplier: each mob through ×N gate spawns (N-1) extra copies.
// ADD gates fire once per level (group bonus).
function onGate(g, idx, mx, my) {
  const id = MID[idx];
  if (g.vis.has(id)) return;
  g.vis.add(id); g.fl=18;

  if (g.type==='add') {
    if (g.once) return; g.once=true;
    if (g.val<0) {
      let k=Math.min(-g.val, nG);
      for (let i=0; i<POOL&&k>0; i++) {const b=i*ST;if(M[b+4]&&M[b+5]===0){die(i);k--;}}
    } else {
      pend += g.val;
      for (let k=0; k<g.val; k++)
        queue.push({d:k*3, x:mx+(Math.random()-.5)*22, y:my+(Math.random()-.5)*6,
          vx:(Math.random()-.5)*1.4, vy:-(G_SPD*(.85+Math.random()*.3)), t:0});
    }
  } else {
    if (g.val<1) {
      if (g.once) return; g.once=true;
      const k=Math.floor(nG*(1-g.val));
      let rem=k;
      for (let i=0; i<POOL&&rem>0; i++) {const b=i*ST;if(M[b+4]&&M[b+5]===0){die(i);rem--;}}
    } else {
      // Per-mob: spawn (val-1) copies
      const copies = Math.floor(g.val-1); // ×2→1, ×3→2, ×5→4
      pend += copies;
      for (let k=0; k<copies; k++)
        queue.push({d:k*4, x:mx+(Math.random()-.5)*26, y:my+(Math.random()-.5)*8,
          vx:(Math.random()-.5)*1.6, vy:-(G_SPD*(.8+Math.random()*.4)), t:0});
    }
  }
}

// ─── Enemy fire ───────────────────────────────────────────────────────────────
function enemyFire() {
  const n=2+Math.min(level,6);
  for (const t of tanks) {
    if (t.hp<=0) continue;
    for (let k=0; k<n; k++)
      spawn(t.x+(Math.random()-.5)*t.w*.8, t.y+t.h/2+4,
            (Math.random()-.5)*1.2, R_SPD*(.9+Math.random()*.25), 1);
  }
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update() {
  if (gst!=='play') {
    if (--gstT<=0) { if(gst==='win'){level++;initLevel();}else{level=1;initLevel();} }
    return;
  }

  // Barrel angle follows pointer
  const norm = Math.max(-1, Math.min(1, (ptrX-W/2)/(W*0.42)));
  angle += ((-Math.PI/2 + norm*Math.PI*0.34) - angle) * 0.18;

  // Fire cannon
  if (holding && hand>0) {
    if (--fireT<=0) {
      hand--;
      spawn(W/2+Math.cos(angle)*28, CY()+Math.sin(angle)*28,
            Math.cos(angle)*G_SPD*1.3, Math.sin(angle)*G_SPD*1.3, 0);
      fireT=FIRE_I;
    }
  }

  // Process spawn queue (gate extras)
  for (let i=queue.length-1; i>=0; i--) {
    const q=queue[i];
    if (--q.d<=0) { spawn(q.x,q.y,q.vx,q.vy,q.t); pend=Math.max(0,pend-1); queue.splice(i,1); }
  }

  // Move + animate
  for (let i=0; i<POOL; i++) {
    const b=i*ST; if(!M[b+4]) continue;
    M[b]+=M[b+2]; M[b+1]+=M[b+3];
    if(++M[b+7]>=7){M[b+7]=0;M[b+6]=(M[b+6]+1)%4;}
    const spd=Math.hypot(M[b+2],M[b+3]);
    const cap=M[b+5]===0?G_SPD*2.2:R_SPD*2.2;
    if(spd>cap){M[b+2]*=cap/spd;M[b+3]*=cap/spd;}
    if(M[b]<-40||M[b]>W+40||M[b+1]<-80||M[b+1]>H+40) die(i);
  }

  buildHash();

  // Separation (same team, liquid crowd feel)
  for (let i=0; i<POOL; i++) {
    const b=i*ST; if(!M[b+4]) continue;
    let sx=0,sy=0;
    for (const j of query(M[b],M[b+1])) {
      if(j===i) continue; const bj=j*ST;
      if(!M[bj+4]||M[bj+5]!==M[b+5]) continue;
      const dx=M[b]-M[bj],dy=M[b+1]-M[bj+1],d2=dx*dx+dy*dy;
      if(d2<(MOB_R*2.5)*(MOB_R*2.5)&&d2>.01){const d=Math.sqrt(d2);sx+=dx/d;sy+=dy/d;}
    }
    M[b+2]+=sx*.05; M[b+3]+=sy*.05;
  }

  // Rock avoidance
  for (let i=0; i<POOL; i++) {
    const b=i*ST; if(!M[b+4]) continue;
    for (const r of rocks) {
      const nx=Math.max(r.x,Math.min(r.x+r.w,M[b]));
      const ny=Math.max(r.y,Math.min(r.y+r.h,M[b+1]));
      const dx=M[b]-nx, dy=M[b+1]-ny, d2=dx*dx+dy*dy;
      if(d2<(MOB_R+5)*(MOB_R+5)&&d2>.001){const d=Math.sqrt(d2);M[b+2]+=dx/d*.6;M[b+3]+=dy/d*.6;}
    }
  }

  // Gate check (green mobs moving upward)
  for (let i=0; i<POOL; i++) {
    const b=i*ST; if(!M[b+4]||M[b+5]!==0||M[b+3]>=0) continue;
    const mx=M[b],my=M[b+1];
    for (const g of gates) {
      if(my>g.y+g.h/2+2||my<g.y-g.h/2-2) continue;
      if(mx<g.x1||mx>g.x2) continue;
      onGate(g,i,mx,my); break;
    }
  }

  // Combat: green vs red → BOTH die (pure annihilation)
  buildHash();
  const dead2 = new Set();
  for (let i=0; i<POOL; i++) {
    const b=i*ST; if(!M[b+4]||dead2.has(i)) continue;
    const ti=M[b+5];
    for (const j of query(M[b],M[b+1])) {
      if(j===i||dead2.has(j)) continue; const bj=j*ST;
      if(!M[bj+4]||M[bj+5]===ti) continue;
      const dx=M[b]-M[bj],dy=M[b+1]-M[bj+1];
      if(dx*dx+dy*dy<(MOB_R*2.1)*(MOB_R*2.1)){
        burst((M[b]+M[bj])/2,(M[b+1]+M[bj+1])/2,ti===0?'#2ecc71':'#e74c3c',6);
        dead2.add(i);dead2.add(j);break;
      }
    }
  }
  for (const i of dead2) die(i);

  // Green mob reaches tank → -1 HP, mob dies
  for (let i=0; i<POOL; i++) {
    const b=i*ST; if(!M[b+4]||M[b+5]!==0) continue;
    for (const t of tanks) {
      if(t.hp<=0) continue;
      if(M[b]>t.x-t.w/2&&M[b]<t.x+t.w/2&&M[b+1]>t.y-t.h-6&&M[b+1]<t.y+t.h/2+6){
        t.hp--; t.fl=12; die(i);
        shake(t.hp>0?4:12);
        addNum(t.x+(Math.random()-.5)*18,t.y-t.h-10,'-1','#ff6b6b');
        if(t.hp<=0) burst(t.x,t.y,'#e74c3c',14);
        break;
      }
    }
  }

  for(const t of tanks) if(t.fl>0)t.fl--;
  for(const g of gates) if(g.fl>0)g.fl--;
  if(--enmT<=0){enemyFire();enmT=ENM_I;}
  tickParts();tickNums();
  if(shT>0)shT--;

  if(tanks.every(t=>t.hp<=0)){gst='win';gstT=140;}
  for(let i=0;i<POOL;i++){const b=i*ST;if(!M[b+4]||M[b+5]!==1)continue;if(M[b+1]>CY()+20){gst='lose';gstT=130;return;}}
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function drawBG() {
  // Sky
  cx.fillStyle='#1a1a2e'; cx.fillRect(0,0,W,H);
  const ll=LL(),lr=LR();
  // Grass sides
  cx.fillStyle='#2a4a1a'; cx.fillRect(0,0,ll,H);
  cx.fillRect(lr,0,W-lr,H);
  // Road gradient
  const rg=cx.createLinearGradient(ll,0,lr,0);
  rg.addColorStop(0,'#b89c72'); rg.addColorStop(0.5,'#c8ac82'); rg.addColorStop(1,'#b89c72');
  cx.fillStyle=rg; cx.fillRect(ll,0,lr-ll,H);
  // Yellow edge stripes
  cx.fillStyle='#e8c048';cx.fillRect(ll,0,5,H);cx.fillRect(lr-5,0,5,H);
  // Center dash
  cx.save();cx.setLineDash([16,22]);cx.strokeStyle='rgba(255,255,255,.20)';cx.lineWidth=3;
  cx.beginPath();cx.moveTo(W/2,0);cx.lineTo(W/2,H);cx.stroke();cx.setLineDash([]);cx.restore();
}

function drawRocks() {
  for (const r of rocks) {
    // shadow
    cx.fillStyle='rgba(0,0,0,.28)';cx.beginPath();cx.roundRect(r.x+4,r.y+5,r.w,r.h,7);cx.fill();
    // base
    cx.fillStyle='#7a6a55';cx.beginPath();cx.roundRect(r.x,r.y,r.w,r.h,7);cx.fill();
    // top lighter stripe
    cx.fillStyle='#9a8a70';cx.beginPath();cx.roundRect(r.x,r.y,r.w,r.h*.4,7);cx.fill();
    // bottom dark stripe
    cx.fillStyle='#5a4a38';cx.beginPath();cx.roundRect(r.x,r.y+r.h*.6,r.w,r.h*.4,7);cx.fill();
    // outline
    cx.strokeStyle='#a89070';cx.lineWidth=1.5;cx.beginPath();cx.roundRect(r.x,r.y,r.w,r.h,7);cx.stroke();
  }
}

function drawGates() {
  cx.textBaseline='middle';
  for (const g of gates) {
    cx.save();
    if(g.fl>0){cx.shadowColor='#fff';cx.shadowBlur=22;}
    const gw=g.x2-g.x1;
    const gg=cx.createLinearGradient(g.x1,0,g.x2,0);
    gg.addColorStop(0,g.color+'aa');gg.addColorStop(.5,g.color);gg.addColorStop(1,g.color+'aa');
    cx.fillStyle=gg;cx.beginPath();cx.roundRect(g.x1,g.y-g.h/2,gw,g.h,8);cx.fill();
    cx.fillStyle='#fff';cx.font='bold 16px Arial';cx.textAlign='center';
    cx.fillText(g.label,g.x1+gw/2,g.y);
    cx.restore();
  }
  cx.textBaseline='alphabetic';
}

function drawMobChar(x, y, fr, team) {
  const r=MOB_R,bc=team===0?'#2ecc71':'#e74c3c',sc=team===0?'#f0c070':'#f5c0a0';
  const lg=[0,3.5,0,-3.5][fr%4];
  cx.fillStyle=bc;
  cx.beginPath();cx.ellipse(x-2.5,y+r+2+lg,2,4.5,.15,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.ellipse(x+2.5,y+r+2-lg,2,4.5,-.15,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.fill();
  cx.fillStyle=sc;cx.beginPath();cx.arc(x,y-r*.88,r*.55,0,Math.PI*2);cx.fill();
  cx.fillStyle='#333';
  cx.beginPath();cx.arc(x-1.7,y-r*.93,1.1,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(x+1.7,y-r*.93,1.1,0,Math.PI*2);cx.fill();
}

function drawMobs() {
  for(let i=0;i<POOL;i++){const b=i*ST;if(!M[b+4])continue;drawMobChar(M[b],M[b+1],M[b+6],M[b+5]);}
}

function drawTanks() {
  for (const t of tanks) {
    if(t.hp<=0) continue;
    cx.save();if(t.fl>0)cx.filter='brightness(2.5)';
    cx.fillStyle='#555';cx.beginPath();cx.roundRect(t.x-t.w/2-5,t.y-8,t.w+10,14,5);cx.fill();
    cx.fillStyle=t.fl>0?'#ff3030':'#c0392b';cx.fillRect(t.x-t.w/2,t.y-t.h,t.w,t.h);
    cx.fillStyle=t.fl>0?'#ff5555':'#e74c3c';
    cx.beginPath();cx.ellipse(t.x,t.y-t.h-3,t.w*.30,9,0,0,Math.PI*2);cx.fill();
    cx.fillStyle='#888';cx.beginPath();cx.roundRect(t.x-4,t.y-t.h-1,8,t.h*.55,2);cx.fill();
    cx.fillStyle='#fff';cx.font='bold 11px Arial';cx.textAlign='center';cx.fillText('★',t.x,t.y-t.h/2+5);
    cx.restore();
    const bw=t.w+20,bh=8,bx=t.x-bw/2,by=t.y-t.h-24;
    cx.fillStyle='#222';cx.fillRect(bx,by,bw,bh);
    const pct=t.hp/t.max;
    cx.fillStyle=pct>.6?'#2ecc71':pct>.3?'#f39c12':'#e74c3c';cx.fillRect(bx,by,bw*pct,bh);
    cx.strokeStyle='#ccc';cx.lineWidth=1;cx.strokeRect(bx,by,bw,bh);
    cx.fillStyle='#fff';cx.font='bold 9px Arial';cx.textAlign='center';cx.fillText(`${t.hp}/${t.max}`,t.x,by-1);
  }
}

function drawCannon() {
  cx.save(); cx.translate(W/2, CY());
  [-18,18].forEach(ox=>{
    cx.fillStyle='#444';cx.beginPath();cx.arc(ox,14,10,0,Math.PI*2);cx.fill();
    cx.fillStyle='#777';cx.beginPath();cx.arc(ox,14,5,0,Math.PI*2);cx.fill();
  });
  cx.fillStyle='#2980b9';cx.beginPath();cx.roundRect(-26,0,52,18,4);cx.fill();
  cx.save();
  cx.rotate(angle+Math.PI/2);
  cx.fillStyle='#1a6fa8';cx.beginPath();cx.roundRect(-6,-36,12,38,4);cx.fill();
  cx.fillStyle='#1565c0';cx.beginPath();cx.roundRect(-7,-38,14,9,3);cx.fill();
  cx.restore();
  cx.fillStyle='#3498db';cx.beginPath();cx.arc(0,0,14,0,Math.PI*2);cx.fill();
  cx.restore();
}

function drawHUD() {
  const total = hand + nG + pend;
  cx.font='bold 52px Arial';cx.textAlign='center';
  cx.strokeStyle='#000';cx.lineWidth=5;cx.strokeText(total,W/2,CY()-36);
  cx.fillStyle='#fff';cx.fillText(total,W/2,CY()-36);
  cx.font='bold 18px Arial';cx.textAlign='left';
  cx.strokeStyle='#000';cx.lineWidth=3;cx.strokeText('Level '+level,12,28);
  cx.fillStyle='#fff';cx.fillText('Level '+level,12,28);
  if(holding){
    cx.save();cx.setLineDash([5,9]);cx.strokeStyle='rgba(255,255,255,.3)';cx.lineWidth=1.5;
    const bx=W/2+Math.cos(angle)*18,by=CY()+Math.sin(angle)*18;
    cx.beginPath();cx.moveTo(bx,by);cx.lineTo(bx+Math.cos(angle)*190,by+Math.sin(angle)*190);
    cx.stroke();cx.setLineDash([]);cx.restore();
  }
}

function drawOverlay() {
  if(gst==='win'){
    cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(0,0,W,H);
    cx.font='bold 56px Arial';cx.textAlign='center';
    cx.strokeStyle='#000';cx.lineWidth=7;cx.strokeText('VICTORY!',W/2,H/2-10);
    cx.fillStyle='#f1c40f';cx.fillText('VICTORY!',W/2,H/2-10);
    cx.font='bold 22px Arial';cx.fillStyle='#fff';cx.fillText('Level '+level+' clear!',W/2,H/2+28);
  } else if(gst==='lose'){
    cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(0,0,W,H);
    cx.font='bold 56px Arial';cx.textAlign='center';
    cx.strokeStyle='#000';cx.lineWidth=7;cx.strokeText('DEFEAT!',W/2,H/2-10);
    cx.fillStyle='#e74c3c';cx.fillText('DEFEAT!',W/2,H/2-10);
    cx.font='bold 20px Arial';cx.fillStyle='#fff';cx.fillText('Restarting...',W/2,H/2+28);
  }
}

function render() {
  cx.save();
  if(shT>0){const s=shA*(shT/14);cx.translate((Math.random()-.5)*s,(Math.random()-.5)*s);}
  drawBG();drawRocks();drawGates();drawMobs();drawTanks();drawCannon();drawParts();drawNums();drawHUD();drawOverlay();
  cx.restore();
}

// ─── Input ────────────────────────────────────────────────────────────────────
function gx(e){return(e.touches?e.touches[0].clientX:e.clientX)-cv.getBoundingClientRect().left;}
cv.addEventListener('mousedown',  e=>{holding=true; ptrX=gx(e);fireT=0;});
cv.addEventListener('mousemove',  e=>{ptrX=gx(e);});
cv.addEventListener('mouseup',    ()=>{holding=false;});
cv.addEventListener('mouseleave', ()=>{holding=false;});
cv.addEventListener('touchstart', e=>{e.preventDefault();holding=true; ptrX=gx(e);fireT=0;},{passive:false});
cv.addEventListener('touchmove',  e=>{e.preventDefault();ptrX=gx(e);},{passive:false});
cv.addEventListener('touchend',   e=>{e.preventDefault();holding=false;},{passive:false});

// ─── Loop ─────────────────────────────────────────────────────────────────────
initLevel();
(function loop(){requestAnimationFrame(loop);update();render();})();
</script>
</body>
</html>
